server:
  port: 8222

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # =========================================================
            # AUTHENTICATION SERVICE
            # =========================================================
            # Login/register endpoints are not authenticated yet,
            # so use IP-based rate limiting here.
            - id: authentication-service
              uri: lb://AUTHENTICATION-SERVICE
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5
                    key-resolver: "#{@ipKeyResolver}"


            # =========================================================
            # CUSTOMER SERVICE
            # =========================================================
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"


            # =========================================================
            # ORDER SERVICE
            # =========================================================
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@userKeyResolver}"


            # =========================================================
            # ORDER LINES SERVICE
            # =========================================================
            - id: order-lines-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/order-lines/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@userKeyResolver}"


            # =========================================================
            # PRODUCT SERVICE
            # =========================================================
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/v1/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"


            # =========================================================
            # PAYMENT SERVICE
            # =========================================================
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 5
                    key-resolver: "#{@userKeyResolver}"


          # ===========================================================
          # CORS
          # ===========================================================
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true


      # =============================================================
      # EUREKA DISCOVERY LOCATOR
      # =============================================================
      # Disabled because routes are explicitly defined above.
      discovery:
        locator:
          enabled: false


# ===============================================================
# JWT
# ===============================================================
jwt:
  secret: ${JWT_SECRET:KLCCwb8qqvO+nveS8CjeR3ASkOIRZnpSG8G/4EaxLBTsYBgnecaiQ962Ym/FnROfUBVkXiaNclp6FYLjQ0XjBw==}
  issuer: authentication-service


# ===============================================================
# EUREKA
# ===============================================================
eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/


# ===============================================================
# ACTUATOR
# ===============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    gateway:
      access: unrestricted


# ===============================================================
# LOGGING
# ===============================================================
logging:
  level:
    org.springframework.cloud.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    org.springframework.cloud.gateway: DEBUG


# ===============================================================
# DOCKER PROFILE
# ===============================================================
---
spring:
  config:
    activate:
      on-profile: docker

  data:
    redis:
      host: redis
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/