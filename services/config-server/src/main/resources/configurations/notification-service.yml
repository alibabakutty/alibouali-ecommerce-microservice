spring:
  mongodb:
    uri: mongodb://alibou:alibou@localhost:27017/notification?authSource=admin

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notificationGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >-
          orderConfirmation:com.alibou.ecommerce.kafka.OrderConfirmation,
          paymentConfirmation:com.alibou.ecommerce.kafka.payment.PaymentConfirmation

  mail:
    host: localhost
    port: 1025

